# Continuous (point-in-time) backup to Oracle Object Storage.
# Bucket, endpoint, keys and the encryption passphrase come from PGBACKREST_* environment variables.
[global]
repo1-type=s3
repo1-path=/pgbackrest
repo1-s3-uri-style=path
repo1-cipher-type=aes-256-cbc
# Keep 4 weekly full backups (and every change log in between): restore to any minute in the last ~4 weeks.
repo1-retention-full-type=count
repo1-retention-full=4
compress-type=zst
compress-level=3
process-max=2
start-fast=y
archive-async=y
spool-path=/var/spool/pgbackrest
log-path=/var/log/pgbackrest
log-level-console=info
log-level-file=detail

[main]
pg1-path=/var/lib/postgresql/data
pg1-user=billing
pg1-database=billing
